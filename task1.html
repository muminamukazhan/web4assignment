<header class="page-head">
  <div class="container">
    <span class="pill-badge mb-3"><span class="dot"></span>Task 1 &middot; Part 1</span>
    <h1>Form with HTML5 validation</h1>
    <p class="mt-3 mb-0">The browser blocks the form until the data is correct. Try an empty form, a wrong email or a short message.</p>
  </div>
</header>

<main class="section pt-3">
  <div class="container">
    <div class="row justify-content-center"><div class="col-lg-8">
      <div class="form-shell">
        <form class="plain-form" action="#" method="post">
          <label for="name">Name (2-50 characters)</label>
          <input type="text" id="name" name="name" required minlength="2" maxlength="50" placeholder="Kurapika Kurta">

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">

          <label for="phone">Phone (format: +7XXXXXXXXXX)</label>
          <input type="tel" id="phone" name="phone" required pattern="\+7[0-9]{10}" title="Use the format +7XXXXXXXXXX" placeholder="+77011234567">

          <label for="age">Age (16-100)</label>
          <input type="number" id="age" name="age" required min="16" max="100">

          <label for="message">Message (10-300 characters)</label>
          <textarea id="message" name="message" rows="5" required minlength="10" maxlength="300"></textarea>
          <small class="counter"><span id="count">0</span> / 300</small>

          <div class="check-row">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I agree to the terms</label>
          </div>

          <button type="submit">Send message</button>
        </form>
      </div>
    </div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const msg = document.getElementById('message');

  msg.addEventListener('input', () => {
    document.getElementById('count').textContent = msg.value.length;
  });
</script>
